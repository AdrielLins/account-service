spring.application.name=account-service

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/treasure_db
spring.datasource.username=treasure_user
spring.datasource.password=treasure_pass

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false

spring.kafka.bootstrap-servers=localhost:29092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.properties.spring.json.add.type.headers=false

logging.level.org.springframework.kafka=INFO

app.kafka.topic.account-created=account-created