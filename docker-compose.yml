services:

    mysql:
        image: mysql:8.0
        container_name: treasure-mysql

        environment:
            MYSQL_ROOT_PASSWORD: root123
            MYSQL_DATABASE: treasure_db
            MYSQL_USER: treasure_user
            MYSQL_PASSWORD: treasure_pass

        ports:
            - "3306:3306"

        volumes:
            - mysql_data:/var/lib/mysql

        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
            timeout: 20s
            retries: 10

    kafka:
        image: confluentinc/cp-kafka:7.6.1
        container_name: treasure-kafka

        ports:
            - "29092:29092"

        environment:
            CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

            KAFKA_NODE_ID: 1

            KAFKA_PROCESS_ROLES: broker,controller

            KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093

            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092

            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

        volumes:
            - kafka_data:/var/lib/kafka/data

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: treasure-kafka-ui

        depends_on:
            - kafka

        ports:
            - "8080:8080"

        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
    mysql_data:
    kafka_data: